name: Model Training Feedback Loop (K-FALL Dataset)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # to check out the repository
      issues: write         # CML needs this to post commit/issue comments
      pull-requests: write  # CML needs this to post PR comments
    # Keep wall-clock time reasonable for a free runner (max 6 h).
    timeout-minutes: 360

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python environment ──────────────────────────────────────────────
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      # ── 3. Install CML (Continuous Machine Learning reporting tool) ───────
      - name: Set up CML
        uses: iterative/setup-cml@v2

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Download Kaggle K-FALL Dataset ──────────────────────────────────
      - name: Download K-FALL Dataset from Kaggle
        run: |
          # Create a directory for the raw dataset
          mkdir -p kfall-raw
          cd kfall-raw
          
          # Download the dataset using curl (as provided)
          echo "Downloading K-FALL dataset from Kaggle..."
          curl -L -o kfall-dataset.zip \
            https://www.kaggle.com/api/v1/datasets/download/usmanabbasi2002/kfall-dataset
          
          # Check if download was successful
          if [ ! -f kfall-dataset.zip ]; then
            echo "ERROR: Failed to download dataset"
            exit 1
          fi
          
          echo "Download successful. File size:"
          ls -lh kfall-dataset.zip
          
          # Extract the dataset
          echo "Extracting dataset..."
          unzip -q kfall-dataset.zip
          
          # List extracted contents
          echo "Extracted contents:"
          ls -la
          cd ..

      # ── 6. Process K-FALL Dataset into required format ─────────────────────
      - name: Process K-FALL Dataset
        run: |
          python3 << 'EOF'
          import os
          import shutil
          import pandas as pd
          from pathlib import Path
          
          # Paths
          raw_dir = Path("kfall-raw")
          data_dir = Path("data/processed/separate_trials")
          data_dir.mkdir(parents=True, exist_ok=True)
          
          # Find and process trial CSV files
          # The K-FALL dataset contains trial folders with CSV files
          all_trials = sorted(raw_dir.glob("/**/*.csv"))
          
          if not all_trials:
              # Try different extraction patterns
              all_trials = sorted(raw_dir.glob("**/trial_*/*.csv"))
          
          if not all_trials:
              # Create sample structure for demo if no actual files found
              print("⚠️  Warning: No trial CSV files found in K-FALL dataset.")
              print("Attempting to locate dataset structure...")
              for root, dirs, files in os.walk(raw_dir):
                  print(f"  {root}: {dirs}, {files[:5]}")  # Show first 5 files per dir
          
          processed_trials = set()
          for csv_file in all_trials:
              # Extract trial number from path
              trial_match = None
              for part in csv_file.parts:
                  if part.startswith('trial_'):
                      trial_match = part
                      break
              
              if not trial_match:
                  continue
                  
              trial_dir = data_dir / trial_match
              trial_dir.mkdir(parents=True, exist_ok=True)
              
              # Copy file with standardized naming
              filename = csv_file.name
              if 'head' in filename.lower():
                  dest_name = f"{trial_match}_head_only.csv"
                  dest_path = trial_dir / dest_name
                  shutil.copy2(csv_file, dest_path)
                  processed_trials.add(trial_match)
                  print(f"✓ Processed: {trial_match}/{dest_name}")
          
          print(f"\n✓ Successfully processed {len(processed_trials)} trials")
          
          EOF

      # ── 7. Upload processed dataset to repository ───────────────────────────
      - name: Upload dataset to repository
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all processed data files
          git add data/
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
          else
            git commit -m "chore: add K-FALL dataset (auto-downloaded from Kaggle)"
            git push origin HEAD:${{ github.ref }}
            echo "✓ Dataset uploaded to repository"
          fi

      # ── COMMENTED OUT: Training Pipeline ───────────────────────────────────

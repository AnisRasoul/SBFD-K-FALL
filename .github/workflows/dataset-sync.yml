name: K-FALL Dataset Sync

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  download-and-upload-dataset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download K-FALL Dataset from Kaggle
        run: |
          mkdir -p dataset/kfall
          echo "Downloading K-FALL dataset from Kaggle..."
          curl -L -o /tmp/kfall-dataset.zip \
            https://www.kaggle.com/api/v1/datasets/download/usmanabbasi2002/kfall-dataset

          if [ ! -f /tmp/kfall-dataset.zip ]; then
            echo "ERROR: Failed to download dataset"
            exit 1
          fi

          echo "Download successful. File size:"
          ls -lh /tmp/kfall-dataset.zip

          echo "Extracting dataset..."
          unzip -q /tmp/kfall-dataset.zip -d dataset/kfall
          rm -f /tmp/kfall-dataset.zip
          echo "Top extracted files:"
          find dataset/kfall -type f | head -n 20

      - name: Upload dataset to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dataset/kfall

          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
          else
            git commit -m "chore: add K-FALL dataset (auto-downloaded from Kaggle)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✓ Dataset uploaded to repository"
          fi
